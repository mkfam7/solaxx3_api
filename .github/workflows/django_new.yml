name: Django CI

on:
  push:
    branches: ["main", "develop", "feature/columns_json_fix"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-with-python-38:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django-version: [4.2]

    steps:
      - uses: actions/checkout@v4
      - name: Test API gateway
        uses: mkfam7/solaxx3_api@cd71d1311c85eaa92039221461f17526008aac60
        with:
          python-version: 3.8
          django-version: ${{ matrix.django-version }}

  build-with-python-39:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: [4.2]
    steps:
      - uses: actions/checkout@v4
      - name: Test API gateway
        uses: mkfam7/solaxx3_api@cd71d1311c85eaa92039221461f17526008aac60
        with:
          python-version: 3.9
          django-version: ${{ matrix.django-version }}

  build-with-python-310:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: [4.2, "5.0", 5.1, 5.2]
    steps:
      - uses: actions/checkout@v4
      - name: Test API gateway
        uses: mkfam7/solaxx3_api@cd71d1311c85eaa92039221461f17526008aac60
        with:
          python-version: 3.10
          django-version: ${{ matrix.django-version }}

  build-with-python-311:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: [4.2, "5.0", 5.1, 5.2]
    steps:
      - uses: actions/checkout@v4
      - name: Test API gateway
        uses: mkfam7/solaxx3_api@cd71d1311c85eaa92039221461f17526008aac60
        with:
          python-version: 3.11
          django-version: ${{ matrix.django-version }}

  build-with-python-312:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: [4.2, "5.0", 5.1, 5.2, "6.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Test API gateway
        uses: mkfam7/solaxx3_api@cd71d1311c85eaa92039221461f17526008aac60
        with:
          python-version: 3.12
          django-version: ${{ matrix.django-version }}

  build-with-python-313:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: [5.1, 5.2, "6.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Test API gateway
        uses: mkfam7/solaxx3_api@cd71d1311c85eaa92039221461f17526008aac60
        with:
          python-version: 3.13
          django-version: ${{ matrix.django-version }}

  build-with-python-314:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: [5.2, "6.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Test API gateway
        uses: mkfam7/solaxx3_api@cd71d1311c85eaa92039221461f17526008aac60
        with:
          python-version: 3.14
          django-version: ${{ matrix.django-version }}
